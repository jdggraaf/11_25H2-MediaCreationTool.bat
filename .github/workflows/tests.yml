name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # weekly, because download links rot on their own

jobs:
  suite:
    name: static + behavioural suite (pwsh, Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Wine and xmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 libxml2-utils

      - name: Initialise a Wine prefix
        env: { WINEDEBUG: -all, WINEPREFIX: /home/runner/.wine-mct }
        run: timeout 300 wineboot -u || true

      - name: Run the suite
        env: { WINEDEBUG: -all, WINEPREFIX: /home/runner/.wine-mct, PWSH: pwsh }
        run: bash tests/static-check.sh

  links:
    name: link check (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Probe every download and documentation url
        run: STRICT=1 bash tests/link-check.sh
